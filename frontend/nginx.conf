# nginx config for serving the built SPA. Listens on 5173 to match compose.
server {
  listen 5173;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback: route all unknown paths to index.html for client routing.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Long cache for hashed static assets.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
